name: site

# Builds site/ (a static Next.js export with primp's real dock bundled in) and deploys it to
# GitHub Pages at a custom domain. The site works at a domain root only (its links and the
# dock's scripts are root-relative), so it does not deploy to <user>.github.io/primp/.
#
# Runs only when both hold:
#   - the repository is public (GitHub Pages on the free plan needs that), and
#   - the repository variable SITE_DOMAIN is set, e.g. primp.dev
#     (gh variable set SITE_DOMAIN --body primp.dev); it becomes the CNAME file.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !github.event.repository.private && vars.SITE_DOMAIN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The dock, the head script and the in-browser stand-in, into site/public/primp.
      - run: pnpm site:assets
      - name: Build the site
        working-directory: site
        run: |
          pnpm install --ignore-workspace --frozen-lockfile
          pnpm build
          echo "${{ vars.SITE_DOMAIN }}" > out/CNAME
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
