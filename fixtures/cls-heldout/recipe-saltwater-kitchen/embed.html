<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Saltwater Kitchen player</title>
<style>
  html, body { margin: 0; background: #1d1712; color: #f6efe4; font: 14px/1.4 "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .player { position: relative; aspect-ratio: 16 / 9; background: #000; }
  .player video { display: block; width: 100%; height: 100%; object-fit: cover; }
  .play { position: absolute; left: 50%; top: 50%; width: 72px; height: 72px; margin: -36px 0 0 -36px; border: 0; border-radius: 50%; background: rgba(200, 69, 43, 0.92); color: #fff; font-size: 26px; cursor: pointer; }
  .bar { display: flex; justify-content: space-between; align-items: center; height: 46px; padding: 0 16px; }
  .bar span:last-child { opacity: 0.7; }
</style>
</head>
<body>
<div class="player">
  <video preload="none" poster="/assets/img/hero-1200x400.png" width="640" height="360" playsinline>
    <source src="/assets/video/clip-640x360.webm" type="video/webm">
  </video>
  <button class="play" type="button" aria-label="Play">▶</button>
</div>
<div class="bar"><span>The four folds · Saltwater Kitchen</span><span>1:32</span></div>
<script>
  function report() {
    parent.postMessage({ type: 'sk-player:height', height: document.documentElement.scrollHeight }, '*');
  }
  window.addEventListener('load', report);
  document.querySelector('.play').addEventListener('click', function () {
    var video = document.querySelector('video');
    this.hidden = true;
    video.controls = true;
    video.play();
  });
</script>
</body>
</html>
