<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>embedded timetable</title>
<style>
  html, body { margin: 0; }
  body { font: 15px/1.5 system-ui, sans-serif; color: #1f2937; background: #f8fafc; }
  table { width: 100%; border-collapse: collapse; }
  caption { padding: 12px 16px; text-align: left; font-weight: 600; }
  th, td { height: 44px; padding: 0 16px; text-align: left; border-top: 1px solid #e2e8f0; box-sizing: border-box; }
</style>
</head>
<body>
<table id="timetable">
  <caption>Departures from the north pier</caption>
  <tr><th>Time</th><th>Destination</th><th>Boat</th></tr>
  <tr><td>06:45</td><td>South quay</td><td>Kittiwake</td></tr>
  <tr><td>07:30</td><td>Island landing</td><td>Guillemot</td></tr>
  <tr><td>08:15</td><td>South quay</td><td>Kittiwake</td></tr>
  <tr><td>09:00</td><td>Island landing</td><td>Guillemot</td></tr>
  <tr><td>10:30</td><td>South quay</td><td>Kittiwake</td></tr>
  <tr><td>12:00</td><td>Island landing</td><td>Guillemot</td></tr>
  <tr><td>14:15</td><td>South quay</td><td>Kittiwake</td></tr>
</table>
</body>
</html>
